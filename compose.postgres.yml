# The node's PostgreSQL, pulled into compose.yml and compose.node.yml with
# `extends`. Layering this file on top (the v0.5.1 opt-in setup,
# COMPOSE_FILE=compose.node.yml:compose.postgres.yml) still works and changes
# nothing.
#
# The password is generated on the first start (or seeded from POSTGRES_PASSWORD
# in .env) and kept in the postgres-secret volume, which the node reads. Nothing
# is published to the host. See docs/provider/deployment.md.
services:
  postgres:
    image: postgres:16-alpine
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        f=/run/routstr-postgres/password
        if [ ! -s "$$f" ]; then
          umask 077
          if [ -n "$${SEED_PASSWORD:-}" ]; then printf '%s' "$$SEED_PASSWORD"; else head -c 32 /dev/urandom | od -An -tx1 | tr -d ' \n'; fi > "$$f.tmp"
          mv "$$f.tmp" "$$f"
        fi
        chown postgres:postgres "$$f"
        unset SEED_PASSWORD
        exec docker-entrypoint.sh postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-routstr}
      POSTGRES_DB: ${POSTGRES_DB:-routstr}
      POSTGRES_PASSWORD_FILE: /run/routstr-postgres/password
      SEED_PASSWORD: ${POSTGRES_PASSWORD:-}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-secret:/run/routstr-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  postgres-data:
  postgres-secret:
