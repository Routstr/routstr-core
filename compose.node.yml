# First-run node stack. Keep the admin API on loopback until the operator
# rotates the generated password and deliberately configures public access.
services:
  ui:
    env_file: .env
    build:
      context: ./ui
      dockerfile: Dockerfile.build
      args:
        NEXT_PUBLIC_ADMIN_API_KEY: ""
    volumes:
      - ./ui_out:/output:z
    command: ["sh", "-c", "mkdir -p /output && cp -r /app/built/. /output/ && echo 'UI built and ready' && tail -f /dev/null"]
    restart: unless-stopped

  routstr:
    build: .
    depends_on:
      - ui
    volumes:
      - .:/app:z
      - ./logs:/app/logs:z
      - ./ui_out:/app/ui_out:ro,z
    env_file: .env
    environment:
      AUTO_GENERATE_NSEC: "false"
      ENABLE_ANALYTICS_SHARING: "false"
    ports:
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
