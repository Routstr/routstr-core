name: Build signed image for Enclava

# Builds Dockerfile.enclava (Dockerfile.full + VOLUME/env wiring for a
# read-only root filesystem), pushes it to GHCR, then cosign keyless-signs the
# digest and attests build provenance/SBOM. Enclava refuses unsigned images:
# `enclava create --signer-subject` pins this workflow's Fulcio identity, so
# the identity below must stay stable.
#
# The build pushes to ghcr.io/sh1ftred/core, not to this repository's own
# package, so it authenticates with the GHCR_PAT repo secret (a sh1ftred PAT
# with write:packages) instead of GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the signed image release record (main only)
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/sh1ftred/core
  DOCKERFILE: Dockerfile.enclava

jobs:
  deploy:
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      build_id: ${{ steps.gitmeta.outputs.build_id }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sh1ftred
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve git metadata
        id: gitmeta
        run: |
          echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"
          echo "build_id=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.gitmeta.outputs.sha }}
            GIT_TAG=${{ github.ref_name }}
            ROUTSTR_ENCLAVA_BUILD_ID=${{ steps.gitmeta.outputs.build_id }}
          tags: |
            ${{ env.IMAGE_NAME }}:enclava
            ${{ env.IMAGE_NAME }}:enclava-${{ steps.gitmeta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        # v4.1.2 — installs cosign 3.x, which emits portable DSSE
        # material; legacy 2.x `.sig` objects may lack it
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Print manual deploy image
        run: |
          echo "Listing build ID: ${{ steps.gitmeta.outputs.build_id }}"
          echo "Deploy manually with:"
          echo "enclava deploy --image ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

  publish-release:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish_release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment: enclava-release
    env:
      IMAGE_DIGEST: ${{ needs.deploy.outputs.digest }}
      ENCLAVA_RELEASE_PUBKEY: ${{ vars.ENCLAVA_RELEASE_PUBKEY }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install signing dependency (x86-64 Linux wheel hash from uv.lock)
        run: |
          python3 -m venv "$RUNNER_TEMP/release-venv"
          echo 'nostr-sdk==0.45.1 --hash=sha256:5e051a662fac81aa2e15e8221915a0ee4c38791fe6284bc286c5f4cc769cc22e' | \
            "$RUNNER_TEMP/release-venv/bin/pip" install --require-hashes --only-binary=:all: --no-deps -r /dev/stdin
      - name: Sign public release record
        env:
          ENCLAVA_RELEASE_NSEC: ${{ secrets.ENCLAVA_RELEASE_NSEC }}
        run: '"$RUNNER_TEMP/release-venv/bin/python" scripts/enclava_release.py sign'
      - name: Preserve exact signed record for deploy and relay retries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: enclava-release-event
          path: enclava-release-event.json
          if-no-files-found: error
      - name: Publish signed record and report acknowledged ID and deploy image
        env:
          ENCLAVA_RELEASE_RELAY: ${{ vars.ENCLAVA_RELEASE_RELAY }}
        run: |
          set -o pipefail
          echo "Listing build ID: ${{ needs.deploy.outputs.build_id }}" >> "$GITHUB_STEP_SUMMARY"
          "$RUNNER_TEMP/release-venv/bin/python" scripts/enclava_release.py publish | tee -a "$GITHUB_STEP_SUMMARY"
