name: Build signed image for Enclava

# Builds Dockerfile.enclava (Dockerfile.full + VOLUME/env wiring for a
# read-only root filesystem), pushes it to GHCR, then cosign keyless-signs the
# digest and attests build provenance/SBOM. Enclava refuses unsigned images:
# `enclava create --signer-subject` pins this workflow's Fulcio identity, so
# the identity below must stay stable.
#
# The build pushes to ghcr.io/sh1ftred/core, not to this repository's own
# package, so it authenticates with the GHCR_PAT repo secret (a sh1ftred PAT
# with write:packages) instead of GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/sh1ftred/core
  DOCKERFILE: Dockerfile.enclava

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: sh1ftred
          password: ${{ secrets.GHCR_PAT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve git metadata
        id: gitmeta
        run: echo "sha=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: true
          build-args: |
            GIT_COMMIT=${{ steps.gitmeta.outputs.sha }}
            GIT_TAG=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE_NAME }}:enclava
            ${{ env.IMAGE_NAME }}:enclava-${{ steps.gitmeta.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        # v4.1.2 — installs cosign 3.x, which emits portable DSSE
        # material; legacy 2.x `.sig` objects may lack it
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with cosign (keyless)
        run: |
          cosign sign --yes \
            ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Print manual deploy image
        run: |
          echo "Deploy manually with:"
          echo "enclava deploy --image ${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
